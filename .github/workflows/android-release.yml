name: KARTA Android Release Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-signing-required:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate release helper scripts
        run: python3 -m py_compile scripts/install_android.py scripts/configure_release_signing.py scripts/test_configure_release_signing.py scripts/verify_release_artifact.py

      - name: Verify offline signing configuration
        run: python3 scripts/test_configure_release_signing.py

      - name: Enforce owner-controlled offline signing
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF'
          KARTA production signing is intentionally OFFLINE.
          Do not upload the permanent keystore, Base64 keystore, signing passwords
          or private signing material to GitHub Actions.

          Follow:
            docs/releases/phase1-build14-device-acceptance.md
            docs/releases/android-signing.md

          Build the release on a trusted owner-controlled machine and verify it with:
            python3 scripts/verify_release_artifact.py build/app/outputs/flutter-apk/app-release.apk
          EOF
