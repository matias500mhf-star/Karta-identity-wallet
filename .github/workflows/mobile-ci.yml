name: KARTA Mobile CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'release/**']
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  android-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter environment
        run: flutter --version

      - name: Validate release helper scripts
        run: python3 -m py_compile scripts/install_android.py scripts/configure_release_signing.py scripts/verify_release_artifact.py

      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --android-language=kotlin --project-name=karta_wallet --org=com.karta.identity --no-pub .

      - name: Install native bridge and KARTA branding
        run: python3 scripts/install_android.py

      - name: Verify KARTA launcher branding
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'android:label="KARTA"' android/app/src/main/AndroidManifest.xml
          grep -n '@drawable/karta_launcher' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/drawable/karta_launcher.xml
          test -f android/app/src/main/res/drawable/launch_background.xml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload Phase 1 build 14 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: karta-0.9-rc1-build14-phase1-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
