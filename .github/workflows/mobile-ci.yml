name: KARTA Mobile CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  android-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter environment
        run: flutter --version

      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --android-language=kotlin --project-name=karta_wallet --org=com.karta.identity --no-pub .

      - name: Mark launcher as local-first test build
        run: |
          sed -i 's/android:label="karta_wallet"/android:label="KARTA LOCAL TEST"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: karta-local-test-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
