name: KARTA Mobile CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  android-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter environment
        run: flutter --version

      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --android-language=kotlin --project-name=karta_wallet --org=com.karta.identity --no-pub .

      - name: Install native PDF and export bridge
        run: python3 scripts/install_android.py

      # Diagnostic build only: a distinct package lets Alpha 0.9 install beside an
      # older KARTA build whose ephemeral CI debug certificate cannot be recovered.
      # Do not merge this applicationId into the production/release line.
      - name: Use migration-safe side-by-side beta package
        run: |
          sed -i 's/applicationId = "com.karta.identity.karta_wallet"/applicationId = "com.karta.identity.karta_wallet.beta"/' android/app/build.gradle.kts
          grep -n 'applicationId' android/app/build.gradle.kts

      - name: Mark launcher as Alpha 0.9 Beta
        run: |
          sed -i 's/android:label="karta_wallet"/android:label="KARTA ALPHA 0.9 BETA"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: karta-alpha-09-side-by-side-beta-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
